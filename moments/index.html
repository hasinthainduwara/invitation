<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ප්‍රතාභිතීර්ථ 2025 — මතක සටහන්. Memories of the batch.">
    <title>ප්‍රතාභිතීර්ථ 2025 | මතක සටහන්</title>
    <script>
        if (window.location.pathname.endsWith('/moments')) {
            window.location.replace(window.location.pathname + '/');
        }
    </script>
    <!-- Google Fonts: Medieval display + Sinhala serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Noto+Serif+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <!-- Floating background particle effect canvas (2D) -->
    <canvas id="particles-canvas"></canvas>

    <!-- Ambient background music -->
    <audio id="bg-music" loop preload="auto">
        <source src="assets/sound.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="music-toggle" aria-label="Toggle music" title="Music">
        <span class="music-icon">&#9834;</span>
    </button>

    <div class="gallery-container">

        <!-- Header Section -->
        <header class="gallery-header text-center">
            <img src="assets/logo.png" class="gallery-logo" alt="ප්‍රතාභිතීර්ථ" lang="si">
            <p class="gallery-subtitle sinhala" lang="si">අභිමානවත් පරපුරක ශ්‍රේෂ්ඨතම ආගමනය..</p>
            <div class="divider-line">
                <span class="line-left"></span>
                <span class="line-right"></span>
            </div>
        </header>

        <!-- Photos Grid (single batch photo) -->
        <main class="gallery-grid single">
            <article class="gallery-card" data-src="assets/moments.JPG" data-title="2023/24 කණ්ඩායම" data-desc="">
                <div class="card-inner">
                    <div class="card-img-wrapper">
                        <img src="assets/moments.JPG" alt="2023/24 කණ්ඩායම" class="gallery-img">
                    </div>
                    <div class="card-info">
                        <span class="card-category cinzel-heading">ප්‍රතාභිතීර්ථ 2025</span>
                        <h2 class="card-title sinhala">2023/24 කණ්ඩායම</h2>
                        <p class="card-date sinhala">තාක්ෂණ පීඨය &middot; ශ්‍රී ජයවර්ධනපුර විශ්වවිද්‍යාලය</p>
                    </div>
                </div>
            </article>
        </main>
    </div>

    <!-- LIGHTBOX MODAL OVERLAY -->
    <div id="lightbox" class="lightbox-modal">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close lightbox">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">&#10094;</button>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">&#10095;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Enlarged gallery view">
            <div class="lightbox-info">
                <h3 id="lightbox-title" class="sinhala"></h3>
                <p id="lightbox-desc" class="sinhala"></p>
            </div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
